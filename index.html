<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPS Demo - Dust 2</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}
  canvas{display:block}
  #crosshair{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    pointer-events:none;z-index:10;
  }
  #crosshair::before,#crosshair::after{
    content:'';position:absolute;background:rgba(0,0,0,0.7);
  }
  #crosshair::before{width:2px;height:14px;left:50%;top:50%;transform:translate(-50%,-50%)}
  #crosshair::after{width:14px;height:2px;left:50%;top:50%;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div id="crosshair"></div>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';

/* --- Test-mode detection --- */
const testMode = location.search.includes('test=1');

/* --- Renderer --- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(testMode ? 1 : Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* --- Scene & background --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

/* --- Camera / player state --- */
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.2, 200);
let yaw = 0, pitch = 0;
let px = 0, py = 1.7, pz = 0;
camera.position.set(px, py, pz);

/* --- Lighting --- */
const ambient = new THREE.AmbientLight(0xffeedd, 0.5);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff4e0, 1.8);
sun.position.set(15, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
scene.add(sun);
scene.add(sun.target);

/* --- Materials --- */
const matGround  = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 1.0 });
const matWall    = new THREE.MeshStandardMaterial({ color: 0xcfb58f, roughness: 0.9 });
const matWall2   = new THREE.MeshStandardMaterial({ color: 0xd4b980, roughness: 0.85 });
const matWall3   = new THREE.MeshStandardMaterial({ color: 0xc9a96e, roughness: 0.95 });
const matCrate   = new THREE.MeshStandardMaterial({ color: 0xb89a62, roughness: 0.8 });
const matCrate2  = new THREE.MeshStandardMaterial({ color: 0xa6874a, roughness: 0.85 });
const matCrate3  = new THREE.MeshStandardMaterial({ color: 0xc49a55, roughness: 0.75 });

/* --- AABB collision list (walls + crates only — ground excluded) --- */
const colliders = [];

/* --- Collect ALL level geometry meshes for raycasting --- */
const levelMeshes = [];

/* --- Helper: solid box (wall/crate) — added to colliders --- */
function addSolid(w, h, d, x, y, z, mat) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  levelMeshes.push(m);
  colliders.push(new THREE.Box3().setFromObject(m));
  return m;
}

/* --- Ground plane (NOT a collider for AABB) --- */
(function() {
  const g = new THREE.BoxGeometry(80, 0.2, 80);
  const m = new THREE.Mesh(g, matGround);
  m.position.set(0, -0.1, 0);
  m.receiveShadow = true;
  scene.add(m);
  levelMeshes.push(m);
})();

/* --- Sealed outer perimeter walls (|x|<=40, |z|<=40) --- */
const wallH = 5, wallT = 1.0;
addSolid(80 + wallT*2, wallH, wallT, 0, wallH/2, -40, matWall);
addSolid(80 + wallT*2, wallH, wallT, 0, wallH/2,  40, matWall);
addSolid(wallT, wallH, 80 + wallT*2, -40, wallH/2, 0, matWall);
addSolid(wallT, wallH, 80 + wallT*2,  40, wallH/2, 0, matWall);

/* --- Inner walls --- */
addSolid(12, 3.0, wallT,  -8, 1.5,  -5, matWall2);
addSolid(12, 3.5, wallT,  -8, 1.75,  5, matWall3);
addSolid(10, 2.5, wallT,  10, 1.25,  0, matWall);
addSolid(8, 3.0, wallT,  20, 1.5, -10, matWall2);
addSolid(wallT, 2.8, 14, -15, 1.4, 0, matWall3);
addSolid(6, 2.0, wallT,   5, 1.0, 15, matWall);
addSolid(6, 3.2, wallT, -18, 1.6, 12, matWall2);

/* --- Crates --- */
const cratePos = [
  [ 5, 0.5,  3], [-5, 0.5,  8], [12, 0.5, -6], [-12, 0.5, -3],
  [ 0, 0.5, -12], [15, 0.5, 10], [-20, 0.5,  5], [ 8, 0.5, 18],
];
const crateMats = [matCrate, matCrate2, matCrate3];
cratePos.forEach((p, i) => addSolid(1, 1, 1, p[0], p[1], p[2], crateMats[i % 3]));

/* --- Per-axis AABB collision resolution --- */
const PRADIUS = 0.3;
const PLAYERTOP = 0.1;
const PLAYERFEET = 1.7;

/* Pre-allocated temp objects for collision (no per-call allocation) */
const tempVec3a = new THREE.Vector3();
const tempVec3b = new THREE.Vector3();
const tempVec3c = new THREE.Vector3();
const tempVec3d = new THREE.Vector3();
const tempBox3a = new THREE.Box3();
const tempBox3b = new THREE.Box3();

function resolveCollision(newX, newZ) {
  tempBox3a.min.set(newX - PRADIUS, py - PLAYERFEET, pz - PRADIUS);
  tempBox3a.max.set(newX + PRADIUS, py + PLAYERTOP, pz + PRADIUS);
  tempBox3b.min.set(px - PRADIUS, py - PLAYERFEET, newZ - PRADIUS);
  tempBox3b.max.set(px + PRADIUS, py + PLAYERTOP, newZ + PRADIUS);
  let xOk = true, zOk = true;
  for (const bb of colliders) {
    if (tempBox3a.intersectsBox(bb)) xOk = false;
    if (tempBox3b.intersectsBox(bb)) zOk = false;
  }
  if (xOk) px = newX;
  if (zOk) pz = newZ;
}

/* --- Input: keyboard (normal mode only) --- */
const keyState = { f: 0, b: 0, l: 0, r: 0 };
document.addEventListener('keydown', e => {
  if (e.key === 'w' || e.key === 'W') keyState.f = 1;
  if (e.key === 's' || e.key === 'S') keyState.b = 1;
  if (e.key === 'a' || e.key === 'A') keyState.l = 1;
  if (e.key === 'd' || e.key === 'D') keyState.r = 1;
});
document.addEventListener('keyup', e => {
  if (e.key === 'w' || e.key === 'W') keyState.f = 0;
  if (e.key === 's' || e.key === 'S') keyState.b = 0;
  if (e.key === 'a' || e.key === 'A') keyState.l = 0;
  if (e.key === 'd' || e.key === 'D') keyState.r = 0;
});

/* --- Input: test-mode flags (separate from keyboard) --- */
const testInput = { f: 0, b: 0, l: 0, r: 0 };

/* --- Mouse look (pointer lock, normal mode only) --- */
if (!testMode) {
  renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
  document.addEventListener('mousemove', e => {
    if (document.pointerLockElement !== renderer.domElement) return;
    yaw   -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    const PITCH_MAX = 89 * Math.PI / 180;
    pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, pitch));
  });
}

/* =============================================
   WEAPON VIEWMODEL
   ============================================= */
const weaponGroup = new THREE.Group();
camera.add(weaponGroup);

const matMetal = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.4, metalness: 0.7 });
const matWood  = new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.85 });

// Stock
const stock = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, 0.18), matWood);
stock.position.set(0.08, -0.04, 0.10);
weaponGroup.add(stock);

// Receiver body
const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.065, 0.30), matMetal);
receiver.position.set(0.07, -0.03, -0.05);
weaponGroup.add(receiver);

// Barrel
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.32, 8), matMetal);
barrel.rotation.x = Math.PI / 2;
barrel.position.set(0.07, -0.015, -0.28);
weaponGroup.add(barrel);

// Magazine
const mag = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.10, 0.06), matMetal);
mag.position.set(0.07, -0.09, -0.02);
weaponGroup.add(mag);

// Grip
const grip = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.08, 0.04), matWood);
grip.position.set(0.07, -0.09, 0.06);
weaponGroup.add(grip);

// Sight
const sight = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.02, 0.04), matMetal);
sight.position.set(0.07, 0.02, -0.12);
weaponGroup.add(sight);

// Position weapon group to lower-right of view
weaponGroup.position.set(0.25, -0.18, -0.45);

/* --- Muzzle flash light (single instance, reused each shot) --- */
const muzzleLight = new THREE.PointLight(0xffaa33, 0, 4, 2);
muzzleLight.position.set(0.07, -0.015, -0.44);
weaponGroup.add(muzzleLight);

/* --- Muzzle flash quad --- */
const flashMat = new THREE.MeshBasicMaterial({
  color: 0xffcc44, transparent: true, opacity: 0,
  side: THREE.DoubleSide, depthWrite: false
});
const flashQuad = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.06), flashMat);
flashQuad.position.set(0.07, -0.015, -0.44);
weaponGroup.add(flashQuad);

/* =============================================
   PROCEDURAL AUDIO (Web Audio API)
   ============================================= */
let audioCtx = null;
let masterGain = null;
let soundsPlayed = 0;

function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.3;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

function playGunshot() {
  const ctx = ensureAudioCtx();
  soundsPlayed++;
  const dur = 0.15;
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = 2500 + Math.random() * 3500;
  const env = ctx.createGain();
  env.gain.setValueAtTime(1.0, ctx.currentTime);
  env.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  src.connect(filt);
  filt.connect(env);
  env.connect(masterGain);
  src.start(ctx.currentTime);
  src.stop(ctx.currentTime + dur);
}

function playImpact() {
  const ctx = ensureAudioCtx();
  soundsPlayed++;
  const dur = 0.06;
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filt = ctx.createBiquadFilter();
  filt.type = 'highpass';
  filt.frequency.value = 3000;
  const env = ctx.createGain();
  env.gain.setValueAtTime(0.4, ctx.currentTime);
  env.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  src.connect(filt);
  filt.connect(env);
  env.connect(masterGain);
  src.start(ctx.currentTime);
  src.stop(ctx.currentTime + dur);
}

function playFootstep() {
  const ctx = ensureAudioCtx();
  soundsPlayed++;
  const dur = 0.08;
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filt = ctx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = 600 + Math.random() * 400;
  filt.Q.value = 1.2;
  const env = ctx.createGain();
  env.gain.setValueAtTime(0.12, ctx.currentTime);
  env.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  src.connect(filt);
  filt.connect(env);
  env.connect(masterGain);
  src.start(ctx.currentTime);
  src.stop(ctx.currentTime + dur);
}

if (testMode) {
  ensureAudioCtx();
}

/* =============================================
   SHOOTING / DECALS
   ============================================= */
const MAX_DECALS = 50;
const decals = [];          // array of { mesh, time }
let shotsFired = 0;
let muzzleFlashTimer = 0;

/* Weapon-model recoil (backswing / muzzle climb) */
let recoilOffset = 0;

/* Camera pitch recoil (visible in getState().pitch) */
let recoilPitch = 0;

/* Pre-allocated temp objects for shooting (no per-shot allocation in hot path) */
const raycaster = new THREE.Raycaster();
const tempVec2 = new THREE.Vector2();
const tempVec3e = new THREE.Vector3();
const tempVec3f = new THREE.Vector3();
const tempQuat = new THREE.Quaternion();

function shoot() {
  shotsFired++;

  // Camera recoil kick — pitch up ~0.04 rad
  recoilPitch += 0.04;

  // Weapon-model recoil kick
  recoilOffset = 0.04;

  // Play gunshot sound
  playGunshot();

  // Raycast from camera center
  raycaster.setFromCamera(tempVec2, camera);
  const hits = raycaster.intersectObjects(levelMeshes, false);

  if (hits.length > 0) {
    const hit = hits[0];
    const normal = hit.face ? hit.face.normal.clone() : tempVec3e.set(0, 1, 0);
    // Transform normal to world space
    const worldNormal = normal.applyQuaternion(hit.object.quaternion);

    // Create impact decal
    const decalGeo = new THREE.PlaneGeometry(0.15, 0.15);
    const decalMat = new THREE.MeshBasicMaterial({
      color: 0x1a1a1a, transparent: true, opacity: 0.85,
      side: THREE.DoubleSide, depthWrite: false
    });
    const decal = new THREE.Mesh(decalGeo, decalMat);
    decal.position.copy(hit.point);
    decal.position.addScaledVector(worldNormal, 0.01);

    // Orient decal to face the normal
    tempQuat.setFromUnitVectors(tempVec3f.set(0, 0, 1), worldNormal);
    decal.quaternion.copy(tempQuat);

    scene.add(decal);
    decals.push({ mesh: decal, time: performance.now() });

    // Play impact sound
    playImpact();

    // Cap at MAX_DECALS
    while (decals.length > MAX_DECALS) {
      const oldest = decals.shift();
      scene.remove(oldest.mesh);
      oldest.mesh.geometry.dispose();
      oldest.mesh.material.dispose();
    }
  }

  // Muzzle flash
  muzzleFlashTimer = 0.05; // 50 ms
  muzzleLight.intensity = 3;
  flashMat.opacity = 0.9;
}

/* --- Normal-mode click to fire --- */
if (!testMode) {
  renderer.domElement.addEventListener('mousedown', e => {
    if (e.button === 0 && document.pointerLockElement === renderer.domElement) {
      ensureAudioCtx();
      shoot();
    }
  });
}

/* =============================================
   TEST HOOK
   ============================================= */
const gameHook = {
  ready: false,
  testMode: testMode,
  input: testInput,
  look(y, p) { yaw = y; pitch = p; },
  getState() {
    return {
      x: px, y: py, z: pz,
      yaw,
      pitch: pitch + recoilPitch,
      decals: decals.length,
      shots: shotsFired,
      audio: !!audioCtx,
      soundsPlayed: soundsPlayed
    };
  },
  fire() { shoot(); }
};
window.__game = gameHook;

/* --- Resize --- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* --- Main loop --- */
const SPEED = 6.0;
let lastTime = performance.now();
let firstFrame = true;
let footstepTimer = 0;

/* Pre-allocated Euler for camera rotation (avoids per-frame allocation) */
const tempEuler = new THREE.Euler(0, 0, 0, 'YXZ');

function animate(now) {
  requestAnimationFrame(animate);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = Math.min(dt, 0.1);

  // Movement
  const inp = testMode ? testInput : keyState;
  const cos = Math.cos(yaw), sin = Math.sin(yaw);
  let mx = 0, mz = 0;
  if (inp.f) { mx -= sin; mz -= cos; }
  if (inp.b) { mx += sin; mz += cos; }
  if (inp.l) { mx -= cos; mz += sin; }
  if (inp.r) { mx += cos; mz -= sin; }
  const len = Math.hypot(mx, mz);
  const moving = len > 0;
  if (len > 0) { mx /= len; mz /= len; resolveCollision(px + mx * SPEED * dt, pz + mz * SPEED * dt); }

  // Footsteps — soft noise tap every ~0.4 s while moving
  if (moving) {
    footstepTimer -= dt;
    if (footstepTimer <= 0) { playFootstep(); footstepTimer = 0.4; }
  }

  // Camera recoil recovery: exponential decay, settles within ~1.5s
  if (recoilPitch > 0.0005) {
    recoilPitch *= Math.pow(0.05, dt);
  } else if (recoilPitch > 0) {
    recoilPitch = 0;
  }

  camera.position.set(px, py, pz);
  tempEuler.set(pitch + recoilPitch, yaw, 0);
  camera.quaternion.setFromEuler(tempEuler);

  // Muzzle flash decay
  if (muzzleFlashTimer > 0) {
    muzzleFlashTimer -= dt;
    if (muzzleFlashTimer <= 0) {
      muzzleLight.intensity = 0;
      flashMat.opacity = 0;
    }
  }

  // Weapon-model recoil recovery
  if (recoilOffset > 0) {
    recoilOffset *= 0.85;
    if (recoilOffset < 0.001) recoilOffset = 0;
  }
  weaponGroup.position.z = -0.45 + recoilOffset * 2;
  weaponGroup.position.y = -0.18 + recoilOffset;

  renderer.render(scene, camera);

  if (firstFrame) { firstFrame = false; gameHook.ready = true; }
}

requestAnimationFrame(animate);
</script>
</body>
</html>
