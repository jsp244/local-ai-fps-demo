<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS Demo - Dust 2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── Test mode detection ──
const searchParams = new URLSearchParams(window.location.search);
const testMode = searchParams.has('test') && searchParams.get('test') === '1';

// ── Player state ──
const player = {
  x: 0, y: 1.7, z: 0,
  yaw: 0, pitch: 0,
  runSpeed: 6.0,
  eyeHeight: 1.7,
  radius: 0.4,
};

// ── Stats ──
let shotsFired = 0;
let decalCount = 0;

// ── Input flags (for test mode) ──
const inputFlags = { f: 0, b: 0, l: 0, r: 0 };

// ── Real keyboard state ──
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// ── Scene setup ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(player.x, player.y, player.z);

// ── Renderer ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(testMode ? 1 : window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── Lighting ──
const sun = new THREE.DirectionalLight(0xffeedd, 2.5);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
scene.add(sun);

const ambient = new THREE.AmbientLight(0xffddaa, 0.6);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x87CEEB, 0xc2956b, 0.4);
scene.add(hemi);

// ── Materials ──
function sandMat(r, g, b) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(r, g, b),
    roughness: 0.9,
    metalness: 0.0,
  });
}

const groundMat = sandMat(0.76, 0.68, 0.50);
const wallMat1 = sandMat(0.72, 0.64, 0.48);
const wallMat2 = sandMat(0.68, 0.60, 0.44);
const wallMat3 = sandMat(0.75, 0.67, 0.52);
const crateMat1 = sandMat(0.55, 0.45, 0.30);
const crateMat2 = sandMat(0.52, 0.42, 0.28);
const crateMat3 = sandMat(0.58, 0.48, 0.33);
const crateMats = [crateMat1, crateMat2, crateMat3];

// ── Geometry helpers ──
function box(w, h, d, mat, px, py, pz) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(px, py, pz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// ── Ground ──
const groundGeo = new THREE.PlaneGeometry(80, 80);
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ── Outer perimeter walls ──
const perimeterH = 6;
const perimeterThick = 0.5;
const perimeter = [
  box(80, perimeterH, perimeterThick, wallMat1, 0, perimeterH / 2, -40),
  box(80, perimeterH, perimeterThick, wallMat1, 0, perimeterH / 2, 40),
  box(perimeterThick, perimeterH, 80, wallMat1, -40, perimeterH / 2, 0),
  box(perimeterThick, perimeterH, 80, wallMat1, 40, perimeterH / 2, 0),
];

// ── Inner walls ──
const innerWalls = [
  box(0.5, 3.5, 16, wallMat2, 2, 1.75, -16),
  box(8, 3, 0.5, wallMat2, -10, 1.5, -10),
  box(12, 3.5, 0.5, wallMat3, -18, 1.75, 8),
  box(0.5, 3, 10, wallMat3, 8, 1.5, 5),
  box(4, 2.5, 0.5, wallMat2, 5, 1.25, 5),
  box(0.5, 4, 6, wallMat1, -5, 2, -5),
  box(10, 2.8, 0.5, wallMat3, 12, 1.4, -5),
  box(0.5, 3, 8, wallMat2, -15, 1.5, -20),
  box(6, 2.5, 0.5, wallMat1, 15, 1.25, 15),
  box(0.5, 2.5, 4, wallMat2, 3, 1.25, 12),
];

// ── Crates (8 total) ──
const crateSize = 1.2;
const crates = [
  box(crateSize, crateSize, crateSize, crateMats[0], -8, crateSize / 2, -12),
  box(crateSize, crateSize, crateSize, crateMats[1], -7, crateSize, -12),
  box(crateSize * 0.8, crateSize * 0.8, crateSize * 0.8, crateMats[2], 10, crateSize * 0.4, 10),
  box(crateSize, crateSize, crateSize, crateMats[0], -20, crateSize / 2, 12),
  box(crateSize * 0.7, crateSize * 0.7, crateSize * 0.7, crateMats[1], 14, crateSize * 0.35, -15),
  box(crateSize, crateSize, crateSize, crateMats[2], -12, crateSize / 2, 20),
  box(crateSize * 0.9, crateSize * 0.9, crateSize * 0.9, crateMats[0], 18, crateSize * 0.45, -20),
  box(crateSize * 0.6, crateSize * 0.6, crateSize * 0.6, crateMats[1], -2, crateSize * 0.3, 15),
];

// ── Collision boxes ──
const colliders = [];

function addCollider(mesh) {
  const geo = mesh.geometry;
  const p = geo.parameters;
  if (p && p.width && p.height && p.depth) {
    const px = mesh.position.x, py = mesh.position.y, pz = mesh.position.z;
    colliders.push([px - p.width/2, px + p.width/2, py - p.height/2, py + p.height/2, pz - p.depth/2, pz + p.depth/2]);
  }
}

perimeter.forEach(addCollider);
innerWalls.forEach(addCollider);
crates.forEach(addCollider);

// ── AABB collision ──
function checkCollision(nx, nz) {
  const r = player.radius;
  const pMinX = nx - r, pMaxX = nx + r;
  const pMinZ = nz - r, pMaxZ = nz + r;
  const pMinY = 0, pMaxY = player.eyeHeight;

  for (const c of colliders) {
    if (pMinX < c[1] && pMaxX > c[0] &&
        pMinY < c[3] && pMaxY > c[2] &&
        pMinZ < c[5] && pMaxZ > c[4]) {
      return true;
    }
  }
  return false;
}

// ── Camera forward ──
function getForwardYaw() {
  return new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
}

// ── Pointer lock (normal mode) ──
if (!testMode) {
  renderer.domElement.addEventListener('click', () => {
    renderer.domElement.requestPointerLock();
  });

  document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === renderer.domElement) {
      const sensitivity = 0.002;
      player.yaw -= e.movementX * sensitivity;
      player.pitch -= e.movementY * sensitivity;
      player.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, player.pitch));
    }
  });
}

// ── Test hook ──
const __game = {
  ready: false,
  testMode: testMode,
  input: inputFlags,
  look: function(yawRad, pitchRad) {
    player.yaw = yawRad;
    player.pitch = pitchRad;
  },
  getState: function() {
    return {
      x: player.x,
      y: player.y,
      z: player.z,
      yaw: player.yaw,
      pitch: player.pitch,
      decals: decalCount,
      shots: shotsFired,
    };
  },
  fire: function() {},
};
window.__game = __game;

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Render loop ──
let prevTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  let dt = (now - prevTime) / 1000;
  prevTime = now;
  dt = Math.min(dt, 0.1);

  // Movement
  let moveFwd = 0, moveRight = 0;

  if (testMode) {
    moveFwd = (inputFlags.f ? 1 : 0) - (inputFlags.b ? 1 : 0);
    moveRight = (inputFlags.r ? 1 : 0) - (inputFlags.l ? 1 : 0);
  } else {
    moveFwd = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
    moveRight = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
  }

  if (moveFwd !== 0 || moveRight !== 0) {
    const forward = getForwardYaw();
    const right = new THREE.Vector3(-forward.z, 0, forward.x);

    const speed = player.runSpeed * dt;
    let dx = forward.x * moveFwd * speed + right.x * moveRight * speed;
    let dz = forward.z * moveFwd * speed + right.z * moveRight * speed;

    if (!checkCollision(player.x + dx, player.z)) {
      player.x += dx;
    }
    if (!checkCollision(player.x, player.z + dz)) {
      player.z += dz;
    }
  }

  // Clamp to play area
  player.x = Math.max(-39, Math.min(39, player.x));
  player.z = Math.max(-39, Math.min(39, player.z));
  player.y = player.eyeHeight;

  // Camera
  camera.position.set(player.x, player.y, player.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  renderer.render(scene, camera);

  if (!__game.ready) {
    __game.ready = true;
  }
}

requestAnimationFrame(animate);
</script>
</body>
</html>
